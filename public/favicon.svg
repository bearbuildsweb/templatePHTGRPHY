<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Metallic Gold Gradients -->
    <linearGradient id="ekoGoldLinear" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#F7E5B5" />
      <stop offset="28%" stop-color="#DFBA70" />
      <stop offset="55%" stop-color="#C5A059" />
      <stop offset="80%" stop-color="#E8CD8C" />
      <stop offset="100%" stop-color="#96722C" />
    </linearGradient>

    <linearGradient id="ekoRimGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8CD8C" />
      <stop offset="30%" stop-color="#C5A059" />
      <stop offset="70%" stop-color="#DFBA70" />
      <stop offset="100%" stop-color="#8A6520" />
    </linearGradient>

    <!-- Radial Subtle Glow in Navy Core -->
    <radialGradient id="ekoCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E2C44" stop-opacity="0.9" />
      <stop offset="55%" stop-color="#162234" stop-opacity="0.95" />
      <stop offset="85%" stop-color="#111927" stop-opacity="1" />
      <stop offset="100%" stop-color="#0D131F" stop-opacity="1" />
    </radialGradient>

    <radialGradient id="ekoAmbientHalo" cx="50%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#C5A059" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#C5A059" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow for Tactile Elevation -->
    <filter id="ekoMonogramShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Dark Midnight Navy Background Disc -->
  <circle cx="256" cy="256" r="246" fill="url(#ekoCoreGlow)" />
  
  <!-- Subtle Internal Radial Gold Glow -->
  <circle cx="256" cy="256" r="210" fill="url(#ekoAmbientHalo)" />

  <!-- Outer Luminous Gold Ring -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#ekoRimGradient)" stroke-width="11" />

  <!-- Fine Archival Inset Bevel Ring -->
  <circle cx="256" cy="256" r="228" fill="none" stroke="#C5A059" stroke-width="1.5" stroke-opacity="0.4" />

